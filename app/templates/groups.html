{% extends "base.html" %}
{% block content %}
<header class="page-header">
  <div>
    <p class="eyebrow">Canais</p>
    <h1>Grupos de TVs</h1>
  </div>
</header>

<section class="content-grid split">
  <form class="panel form-panel" method="post" action="/groups">
    <h2>Criar grupo</h2>
    <label>Nome
      <input name="name" required placeholder="Recepcao">
    </label>
    <label>Slug
      <input name="slug" placeholder="recepcao">
    </label>
    <label>Playlist
      <select name="playlist_id">
        <option value="">Sem playlist</option>
        {% for playlist in playlists %}
        <option value="{{ playlist.id }}">{{ playlist.name }}</option>
        {% endfor %}
      </select>
    </label>
    <button class="button primary" type="submit">Criar</button>
  </form>

  <div class="panel">
    <div class="panel-title"><h2>Grupos</h2></div>
    <div class="group-list">
      {% for group in groups %}
      <div class="edit-card">
        <form method="post" action="/groups/{{ group.id }}/update">
          <div class="edit-grid">
            <label>Nome<input name="name" value="{{ group.name }}" required></label>
            <label>Slug<input name="slug" value="{{ group.slug }}" required></label>
            <label>Playlist
              <select name="playlist_id">
                <option value="">Sem playlist</option>
                {% for playlist in playlists %}
                <option value="{{ playlist.id }}" {% if group.playlist_id == playlist.id %}selected{% endif %}>{{ playlist.name }}</option>
                {% endfor %}
              </select>
            </label>
          </div>
          <div class="card-footer">
            <span>{{ group.screens_total }} TVs</span>
            <a href="{{ base_url }}/player/{{ group.slug }}" target="_blank">/player/{{ group.slug }}</a>
            <button class="button" type="submit">Salvar</button>
          </div>
        </form>
        <form class="delete-inline" method="post" action="/groups/{{ group.id }}/delete" onsubmit="return confirm('Excluir este grupo? As TVs dele ficarao sem grupo.')">
          <button class="link danger" type="submit">Excluir grupo</button>
        </form>
      </div>
      {% else %}
      <p class="empty">Nenhum grupo cadastrado.</p>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
