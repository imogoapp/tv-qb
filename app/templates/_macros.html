{# Campo de senha com botão de olho (mostrar/ocultar). O comportamento fica em app.js. #}
{% macro password_field(name, autocomplete="current-password", id="", required=true, minlength=0, placeholder="", autofocus=false, with_icon=false) -%}
<span class="password-field {{ 'has-icon' if with_icon else '' }}">
  {% if with_icon %}
  <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
  {% endif %}
  <input {% if id %}id="{{ id }}"{% endif %} name="{{ name }}" type="password" autocomplete="{{ autocomplete }}"
         {% if required %}required{% endif %} {% if minlength %}minlength="{{ minlength }}"{% endif %}
         {% if placeholder %}placeholder="{{ placeholder }}"{% endif %} {% if autofocus %}autofocus{% endif %}>
  <button class="toggle-pass" type="button" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
    <svg class="icon eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    <svg class="icon eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-6.4 0-10-7-10-7a18.6 18.6 0 0 1 4.1-5.1M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
  </button>
</span>
{%- endmacro %}
